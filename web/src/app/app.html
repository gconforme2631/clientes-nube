<main> 
  <h1>Registro de clientes</h1> 
  
  <form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate> 
    <div class="campo"> 
      <label for="nombre">Nombre completo</label> 
      <input id="nombre" type="text" formControlName="nombre" autocomplete="name" required 
/> 
    </div> 
    <div class="campo"> 
      <label for="correo">Correo electrónico</label> 
      <input id="correo" type="email" formControlName="correo" autocomplete="email" required 
/> 
    </div> 
    <div class="campo"> 
      <label for="telefono">Teléfono (opcional)</label> 
      <input id="telefono" type="tel" formControlName="telefono" placeholder="0991234567" /> 
    </div> 
    <button type="submit">Guardar cliente</button> 
  </form> 
  
  <p role="status" aria-live="polite" [class.error]="esError()" [class.exito]="!esError()"> 
    {{ mensaje() }} 
  </p> 
  
  <div class="tabla"> 
    <table> 
      <caption>Clientes registrados</caption> 
      <thead> 
        <tr> 
          <th scope="col">Nombre</th> 
          <th scope="col">Correo</th> 
          <th scope="col">Teléfono</th> 
          <th scope="col">Acciones</th> 
        </tr> 
      </thead> 
      <tbody> 
        @for (cliente of clientes(); track cliente.id) { 
          <tr> 
            <td>{{ cliente.nombre }}</td> 
            <td>{{ cliente.correo }}</td> 
            <td>{{ cliente.telefono ?? '—' }}</td> 
            <td> 
              <button type="button" class="eliminar" (click)="eliminar(cliente)" 
                      [attr.aria-label]="'Eliminar a ' + cliente.nombre">Eliminar</button> 
            </td> 
          </tr> 
        } @empty { 
          <tr><td colspan="4">Todavía no hay clientes registrados.</td></tr> 
        } 
      </tbody> 
    </table> 
  </div> 
</main>
